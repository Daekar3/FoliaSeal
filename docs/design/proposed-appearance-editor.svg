<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <title>Proposed Appearance editor — approval pending</title>
  <desc>Unfrozen topology proposal. The active interface shows a fitting Stacked example. Styling and Signing details are collapsed inside the scrollable left form. A separate annotation below the window shows Compact non-fit behavior; it is not an always-visible product warning. Name, preview and Library footer stay in place as form content scrolls.</desc>
  <style>
    .bg{fill:#f4f4f2}.panel{fill:#fff;stroke:#888781;stroke-width:2}.subtle{fill:#efefec;stroke:#aaa9a4;stroke-width:1.5}.button{fill:#f8f8f6;stroke:#777772;stroke-width:1.4}.primary{fill:#356ea5;stroke:#28557f;stroke-width:1.5}.field{fill:#fff;stroke:#8d8d88;stroke-width:1.3}.rule{stroke:#c1c1bc;stroke-width:1.3}.t{font:18px sans-serif;fill:#262624}.small{font:15px sans-serif;fill:#4d4d49}.tiny{font:13px sans-serif;fill:#60605b}.head{font:bold 24px sans-serif;fill:#20201e}.section{font:bold 17px sans-serif;fill:#292927}.white{font:bold 16px sans-serif;fill:#fff}.whiteSmall{font:bold 13px sans-serif;fill:#fff}.check{fill:#356ea5;stroke:#28557f;stroke-width:1}.radio{fill:#fff;stroke:#777;stroke-width:1.5}.dot{fill:#356ea5}.annotation{fill:#fff;stroke:#888781;stroke-width:1.5;stroke-dasharray:6 5}
  </style>
  <rect class="bg" width="1440" height="960"/>
  <rect class="panel" x="25" y="25" width="1390" height="850" rx="7"/>
  <text class="head" x="55" y="68">Signature Library</text>
  <text class="small" x="55" y="94">Appearances › Formal Approval Block · PROPOSED, NOT APPROVED</text>
  <line class="rule" x1="25" y1="115" x2="1415" y2="115"/>
  <text class="tiny" x="55" y="146">CATALOG</text>
  <rect class="field" x="55" y="155" width="190" height="40" rx="3"/><text class="t" x="70" y="181">Appearances</text><text class="small" x="220" y="181">⌄</text>
  <text class="tiny" x="265" y="146">SAVED OBJECT</text>
  <rect class="field" x="265" y="155" width="390" height="40" rx="3"/><text class="t" x="280" y="181">Formal Approval Block</text><text class="small" x="630" y="181">⌄</text>
  <text class="tiny" x="685" y="146">SORT</text>
  <rect class="field" x="685" y="155" width="145" height="40" rx="3"/><text class="small" x="700" y="181">Name A–Z</text><text class="small" x="800" y="181">⌄</text>
  <rect class="button" x="850" y="155" width="108" height="40" rx="4"/><text class="small" x="871" y="181">Duplicate</text>
  <rect class="button" x="966" y="155" width="88" height="40" rx="4"/><text class="small" x="986" y="181">Rename</text>
  <rect class="button" x="1062" y="155" width="72" height="40" rx="4"/><text class="small" x="1086" y="181">Pin</text>
  <rect class="button" x="1142" y="155" width="90" height="40" rx="4"/><text class="small" x="1165" y="181">Delete</text>
  <rect class="primary" x="1240" y="155" width="145" height="40" rx="4"/><text class="whiteSmall" x="1248" y="181">Create Appearance</text>
  <line class="rule" x1="45" y1="215" x2="1395" y2="215"/>
  <rect class="panel" x="45" y="233" width="1350" height="572" rx="5"/>
  <line class="rule" x1="780" y1="270" x2="780" y2="780"/>

  <!-- Name is fixed above the scrollable form. -->
  <text class="section" x="70" y="270">Appearance</text>
  <text class="small" x="70" y="306">Name</text>
  <rect class="field" x="70" y="318" width="663" height="36" rx="3"/><text class="small" x="86" y="342">Formal Approval Block</text>

  <!-- Scrollable content column. -->
  <text class="section" x="70" y="387">Visible text</text>
  <text class="small" x="70" y="410">Choose which signing details appear in the visible signature.</text>
  <rect class="radio" x="70" y="425" width="18" height="18" rx="2"/><text class="small" x="98" y="440">Show field names</text>
  <rect class="check" x="70" y="452" width="18" height="18" rx="2"/><text class="white" x="73" y="467">✓</text><text class="small" x="98" y="467">Common name</text>
  <rect class="radio" x="70" y="478" width="18" height="18" rx="2"/><text class="small" x="98" y="493">Distinguished name</text>
  <rect class="radio" x="70" y="504" width="18" height="18" rx="2"/><text class="small" x="98" y="519">Email</text>
  <rect class="radio" x="70" y="530" width="18" height="18" rx="2"/><text class="small" x="98" y="545">Company</text>
  <rect class="check" x="320" y="452" width="18" height="18" rx="2"/><text class="white" x="323" y="467">✓</text><text class="small" x="348" y="467">Signing time</text>
  <rect class="radio" x="320" y="478" width="18" height="18" rx="2"/><text class="small" x="348" y="493">Title</text>
  <rect class="radio" x="320" y="504" width="18" height="18" rx="2"/><text class="small" x="348" y="519">Reason</text>
  <rect class="radio" x="320" y="530" width="18" height="18" rx="2"/><text class="small" x="348" y="545">Location</text>
  <text class="tiny" x="70" y="574">Field order</text>
  <rect class="field" x="150" y="554" width="250" height="34" rx="3"/><text class="small" x="164" y="576">Signing time ⌄</text>
  <rect class="button" x="412" y="554" width="132" height="34" rx="3"/><text class="small" x="426" y="576">Move field up</text>
  <rect class="subtle" x="552" y="554" width="152" height="34" rx="3"/><text class="small" x="563" y="576" opacity="0.45">Move field down</text>

  <text class="section" x="70" y="622">Image</text>
  <rect class="field" x="70" y="632" width="395" height="34" rx="3"/><text class="small" x="84" y="654">signature.png</text>
  <rect class="button" x="476" y="632" width="112" height="34" rx="3"/><text class="small" x="499" y="654">Replace…</text>
  <rect class="button" x="596" y="632" width="108" height="34" rx="3"/><text class="small" x="622" y="654">Remove</text>
  <text class="tiny" x="70" y="692">Position</text>
  <circle class="radio" cx="150" cy="687" r="9"/><circle class="dot" cx="150" cy="687" r="5"/><text class="small" x="167" y="692">Left</text>
  <circle class="radio" cx="228" cy="687" r="9"/><text class="small" x="245" y="692">Right</text>
  <circle class="radio" cx="320" cy="687" r="9"/><text class="small" x="337" y="692">Above</text>
  <circle class="radio" cx="417" cy="687" r="9"/><text class="small" x="434" y="692">Below</text>
  <rect class="field" x="70" y="710" width="300" height="32" rx="3"/><text class="small" x="84" y="731">Layout: Stacked (default) ⌄</text>
  <rect class="field" x="380" y="710" width="324" height="32" rx="3"/><text class="small" x="394" y="731">Font family: Sans Serif ⌄</text>
  <rect class="subtle" x="70" y="750" width="634" height="26" rx="4"/><text class="small" x="88" y="769">▸ Signing details</text>
  <rect class="subtle" x="70" y="780" width="634" height="20" rx="4"/><text class="tiny" x="88" y="795">▸ Style</text>

  <!-- One sticky 3:1 synthetic example. -->
  <text class="section" x="810" y="300">Example signature · 3 × 1 in</text>
  <text class="tiny" x="810" y="324">Example values · never saved</text>
  <rect x="810" y="354" width="540" height="180" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <path d="M825 466 C852 390,878 482,908 408 C931 390,954 470,980 410 C1001 392,1026 463,1051 416" fill="none" stroke="#274b80" stroke-width="4"/>
  <text class="small" x="1084" y="412">Digitally signed by</text>
  <text class="small" x="1084" y="441">Morgan Ellery</text>
  <text class="small" x="1084" y="470">2026-08-09 18:35 UTC</text>

  <!-- Library-wide transactional footer stays fixed. -->
  <line class="rule" x1="25" y1="825" x2="1415" y2="825"/><text class="tiny" x="55" y="855">Unsaved Appearance changes</text>
  <rect class="button" x="1160" y="838" width="100" height="34" rx="4"/><text class="small" x="1187" y="861">Cancel</text>
  <rect class="primary" x="1272" y="838" width="112" height="34" rx="4"/><text class="white" x="1307" y="861">Save</text>

  <!-- Diagram annotation, outside the interface: this alternate state is not shown with the fitting example above. -->
  <rect class="annotation" x="810" y="895" width="540" height="48" rx="4"/>
  <text class="tiny" x="828" y="916">Alternate Compact state with this wide image: the sample does not fit.</text>
  <text class="tiny" x="828" y="934">This annotation is outside the active editor, not an always-visible warning.</text>
</svg>
