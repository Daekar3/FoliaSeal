<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <title>FoliaSeal Signature Library compact-selector wireframe</title>
  <desc>Modeless Signature Library with compact catalog and saved-object selectors above one dominant transactional editor.</desc>
  <style>
    .bg{fill:#f4f4f2}.panel{fill:#fff;stroke:#888781;stroke-width:2}.subtle{fill:#efefec;stroke:#aaa9a4;stroke-width:1.5}.button{fill:#f8f8f6;stroke:#777772;stroke-width:1.4}.primary{fill:#356ea5;stroke:#28557f;stroke-width:1.5}.field{fill:#fff;stroke:#8d8d88;stroke-width:1.3}.rule{stroke:#c1c1bc;stroke-width:1.3}.t{font:18px sans-serif;fill:#262624}.small{font:15px sans-serif;fill:#4d4d49}.tiny{font:13px sans-serif;fill:#60605b}.head{font:bold 24px sans-serif;fill:#20201e}.section{font:bold 17px sans-serif;fill:#292927}.white{font:bold 16px sans-serif;fill:#fff}
  </style>
  <rect class="bg" width="1440" height="900"/>
  <rect class="panel" x="25" y="25" width="1390" height="850" rx="7"/>
  <text class="head" x="55" y="68">Signature Library</text>
  <text class="small" x="55" y="94">Manage reusable signing setups independently of the open document</text>
  <line class="rule" x1="25" y1="115" x2="1415" y2="115"/>

  <!-- Compact context header -->
  <text class="tiny" x="55" y="146">CATALOG</text>
  <rect class="field" x="55" y="155" width="190" height="40" rx="3"/>
  <text class="t" x="70" y="181">Presets</text><text class="small" x="220" y="181">⌄</text>
  <text class="tiny" x="265" y="146">SAVED OBJECT</text>
  <rect class="field" x="265" y="155" width="430" height="40" rx="3"/>
  <text class="t" x="280" y="181">Board Approval</text><text class="small" x="670" y="181">⌄</text>
  <text class="tiny" x="715" y="146">SORT</text>
  <rect class="field" x="715" y="155" width="160" height="40" rx="3"/>
  <text class="small" x="730" y="181">Name A–Z</text><text class="small" x="850" y="181">⌄</text>

  <rect class="button" x="55" y="209" width="98" height="34" rx="4"/><text class="small" x="82" y="232">New</text>
  <rect class="button" x="163" y="209" width="110" height="34" rx="4"/><text class="small" x="185" y="232">Duplicate</text>
  <rect class="button" x="283" y="209" width="98" height="34" rx="4"/><text class="small" x="306" y="232">Rename</text>
  <rect class="button" x="391" y="209" width="98" height="34" rx="4"/><text class="small" x="422" y="232">Pin</text>
  <rect class="button" x="499" y="209" width="98" height="34" rx="4"/><text class="small" x="524" y="232">Delete</text>
  <text class="tiny" x="1130" y="231">Presets are the default catalog</text>
  <line class="rule" x1="45" y1="260" x2="1395" y2="260"/>

  <!-- Dominant editor -->
  <rect class="panel" x="45" y="278" width="1350" height="527" rx="5"/>
  <text class="section" x="70" y="315">Board Approval</text>
  <text class="tiny" x="1318" y="314">Ready</text>
  <line class="rule" x1="70" y1="332" x2="1370" y2="332"/>

  <text class="small" x="70" y="367">Preset name</text>
  <rect class="field" x="70" y="380" width="480" height="38" rx="3"/>
  <text class="small" x="86" y="405">Board Approval</text>

  <text class="section" x="70" y="462">Appearance  •  Required</text>
  <rect class="subtle" x="70" y="476" width="480" height="58" rx="3"/>
  <text class="small" x="86" y="501">Formal Approval Block</text>
  <text class="tiny" x="86" y="521">Text and image • Ready</text>
  <rect class="button" x="564" y="476" width="88" height="58" rx="4"/><text class="small" x="590" y="510">Edit</text>
  <rect class="button" x="662" y="476" width="120" height="58" rx="4"/><text class="small" x="684" y="501">Create new</text>
  <text class="tiny" x="835" y="726">Nested editors replace this editor while preserving the preset draft.</text>

  <rect class="subtle" x="70" y="554" width="712" height="112" rx="4"/>
  <text class="tiny" x="88" y="578">SAMPLE PREVIEW • representative size</text>
  <rect x="88" y="592" width="676" height="54" fill="#fff" stroke="#333" stroke-width="1"/>
  <text class="tiny" x="104" y="615">Digitally signed by Morgan Ellery • Board Secretary</text>
  <text class="tiny" x="104" y="635">2026-08-09 18:35 UTC</text>

  <text class="section" x="835" y="367">Certificate  •  Optional</text>
  <rect class="subtle" x="835" y="380" width="380" height="70" rx="3"/>
  <text class="small" x="851" y="407">Corporate Records Signing</text>
  <text class="tiny" x="851" y="429">Self-signed • Ready for local signing</text>
  <rect class="button" x="1229" y="380" width="72" height="70" rx="4"/><text class="small" x="1250" y="420">Edit</text>
  <rect class="button" x="1311" y="380" width="64" height="70" rx="4"/><text class="tiny" x="1324" y="411">Create</text><text class="tiny" x="1328" y="429">new</text>

  <text class="section" x="835" y="500">Placement  •  Optional</text>
  <rect class="subtle" x="835" y="514" width="380" height="70" rx="3"/>
  <text class="small" x="851" y="541">Controlled Form • Approval box</text>
  <text class="tiny" x="851" y="563">Page 3 • 612 × 792 pt source page</text>
  <rect class="button" x="1229" y="514" width="72" height="70" rx="4"/><text class="small" x="1250" y="554">Edit</text>
  <rect class="button" x="1311" y="514" width="64" height="70" rx="4"/><text class="tiny" x="1324" y="545">Create</text><text class="tiny" x="1328" y="563">new</text>

  <rect class="subtle" x="835" y="618" width="540" height="80" rx="4"/>
  <text class="small" x="853" y="648">This preset is ready.</text>
  <text class="tiny" x="853" y="674">Saving changes does not apply it to the open document.</text>

  <!-- Stable transaction footer -->
  <line class="rule" x1="25" y1="825" x2="1415" y2="825"/>
  <text class="tiny" x="55" y="855">Unsaved preset changes</text>
  <rect class="button" x="1160" y="838" width="100" height="34" rx="4"/><text class="small" x="1187" y="861">Cancel</text>
  <rect class="primary" x="1272" y="838" width="112" height="34" rx="4"/><text class="white" x="1307" y="861">Save</text>
</svg>
