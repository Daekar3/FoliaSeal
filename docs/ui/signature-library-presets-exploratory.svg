<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <style>
    .bg { fill:#f4f4f2; }
    .panel { fill:#ffffff; stroke:#8b8b86; stroke-width:2; }
    .subtle { fill:#eeeeeb; stroke:#aaa9a4; stroke-width:1.5; }
    .selected { fill:#dfeafb; stroke:#4776a8; stroke-width:2; }
    .button { fill:#f7f7f5; stroke:#777772; stroke-width:1.5; }
    .primary { fill:#356ea5; stroke:#28557f; stroke-width:1.5; }
    .disabled { fill:#eeeeec; stroke:#b8b8b3; stroke-width:1.5; }
    .t { font-family:sans-serif; font-size:18px; fill:#262624; }
    .small { font-family:sans-serif; font-size:15px; fill:#4d4d49; }
    .tiny { font-family:sans-serif; font-size:13px; fill:#5c5c57; }
    .head { font-family:sans-serif; font-size:24px; font-weight:700; fill:#20201e; }
    .section { font-family:sans-serif; font-size:17px; font-weight:700; fill:#292927; }
    .white { font-family:sans-serif; font-size:16px; font-weight:700; fill:#fff; }
    .rule { stroke:#c1c1bc; stroke-width:1.5; }
  </style>

  <rect class="bg" width="1440" height="900"/>
  <rect class="panel" x="25" y="25" width="1390" height="850" rx="7"/>
  <text class="head" x="55" y="68">Signature Library</text>
  <text class="small" x="55" y="94">Manage reusable signing setups independently of the open document</text>
  <line class="rule" x1="25" y1="115" x2="1415" y2="115"/>

  <!-- Stable catalog navigation -->
  <rect class="subtle" x="45" y="135" width="190" height="670" rx="5"/>
  <text class="section" x="65" y="172">Library</text>
  <rect class="selected" x="57" y="190" width="166" height="46" rx="4"/>
  <text class="t" x="75" y="219">Presets</text>
  <text class="t" x="75" y="274">Certificates</text>
  <text class="t" x="75" y="326">Appearances</text>
  <text class="t" x="75" y="378">Placements</text>
  <text class="tiny" x="65" y="770">Presets are the default</text>
  <text class="tiny" x="65" y="789">landing view.</text>

  <!-- Master list -->
  <rect class="panel" x="255" y="135" width="330" height="670" rx="5"/>
  <text class="section" x="277" y="172">Signature Presets</text>
  <rect class="button" x="462" y="147" width="102" height="36" rx="4"/>
  <text class="small" x="480" y="171">+ New</text>
  <rect class="subtle" x="275" y="197" width="290" height="38" rx="4"/>
  <text class="small" x="292" y="222">Search presets</text>

  <rect class="selected" x="275" y="252" width="290" height="78" rx="4"/>
  <text class="section" x="291" y="280">Board Approval</text>
  <text class="tiny" x="291" y="306">Ready • Page 3 placement</text>
  <text class="section" x="291" y="363">Invoice Approval</text>
  <text class="tiny" x="291" y="388">Ready • Placement chosen per PDF</text>
  <line class="rule" x1="275" y1="407" x2="565" y2="407"/>
  <text class="section" x="291" y="443">Visitor Form</text>
  <text class="tiny" x="291" y="468">Incomplete • Appearance missing</text>

  <!-- Detail editor -->
  <rect class="panel" x="605" y="135" width="790" height="670" rx="5"/>
  <text class="section" x="630" y="172">Board Approval</text>
  <text class="tiny" x="1260" y="170">Ready</text>
  <line class="rule" x1="625" y1="190" x2="1375" y2="190"/>

  <text class="small" x="630" y="224">Preset name</text>
  <rect class="subtle" x="630" y="236" width="355" height="38" rx="3"/>
  <text class="small" x="646" y="261">Board Approval</text>

  <text class="section" x="630" y="314">Appearance  •  Required</text>
  <rect class="subtle" x="630" y="328" width="355" height="52" rx="3"/>
  <text class="small" x="646" y="360">Formal Approval Block</text>
  <rect class="button" x="998" y="328" width="82" height="52" rx="4"/>
  <text class="small" x="1019" y="359">Edit</text>
  <rect class="button" x="1090" y="328" width="116" height="52" rx="4"/>
  <text class="small" x="1108" y="350">Create</text>
  <text class="small" x="1108" y="369">new</text>

  <rect class="subtle" x="630" y="397" width="576" height="112" rx="4"/>
  <text class="tiny" x="648" y="420">SAMPLE PREVIEW • representative size</text>
  <rect x="648" y="434" width="540" height="55" fill="#fff" stroke="#333" stroke-width="1"/>
  <text class="tiny" x="663" y="458">Digitally signed by Morgan Ellery • Board Secretary</text>
  <text class="tiny" x="663" y="478">2026-08-09 18:35 UTC</text>

  <text class="section" x="630" y="548">Certificate  •  Optional</text>
  <rect class="subtle" x="630" y="561" width="355" height="52" rx="3"/>
  <text class="small" x="646" y="584">Corporate Records Signing</text>
  <text class="tiny" x="646" y="603">Self-signed • Ready for local signing</text>
  <rect class="button" x="998" y="561" width="82" height="52" rx="4"/>
  <text class="small" x="1019" y="592">Edit</text>
  <rect class="button" x="1090" y="561" width="116" height="52" rx="4"/>
  <text class="small" x="1108" y="583">Create</text>
  <text class="small" x="1108" y="602">new</text>

  <text class="section" x="630" y="650">Placement  •  Optional</text>
  <rect class="subtle" x="630" y="663" width="355" height="57" rx="3"/>
  <text class="small" x="646" y="687">Controlled Form • Approval box</text>
  <text class="tiny" x="646" y="707">Page 3 • 612 × 792 pt source page</text>
  <rect class="button" x="998" y="663" width="82" height="57" rx="4"/>
  <text class="small" x="1019" y="697">Edit</text>
  <rect class="button" x="1090" y="663" width="116" height="57" rx="4"/>
  <text class="small" x="1108" y="687">Create</text>
  <text class="small" x="1108" y="706">new</text>

  <text class="tiny" x="1223" y="348">Component editors open</text>
  <text class="tiny" x="1223" y="367">within this same window.</text>

  <!-- Fixed transaction footer -->
  <line class="rule" x1="25" y1="825" x2="1415" y2="825"/>
  <text class="tiny" x="55" y="855">Unsaved preset changes</text>
  <rect class="button" x="1160" y="838" width="100" height="34" rx="4"/>
  <text class="small" x="1187" y="861">Cancel</text>
  <rect class="primary" x="1272" y="838" width="112" height="34" rx="4"/>
  <text class="white" x="1307" y="861">Save</text>
</svg>
