<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <title>FoliaSeal Placement editor exploratory wireframe</title>
  <desc>Signature Library placement editor showing captured source geometry, direct manipulation, and compact visible-page-relative numeric controls.</desc>
  <style>
    .bg{fill:#f4f4f2}.panel{fill:#fff;stroke:#888781;stroke-width:2}.subtle{fill:#efefec;stroke:#aaa9a4;stroke-width:1.5}.selected{fill:#dfeafb;stroke:#4776a8;stroke-width:2}.button{fill:#f8f8f6;stroke:#777772;stroke-width:1.4}.primary{fill:#356ea5;stroke:#28557f;stroke-width:1.5}.field{fill:#fff;stroke:#8d8d88;stroke-width:1.3}.rule{stroke:#c1c1bc;stroke-width:1.3}.page{fill:#fff;stroke:#777;stroke-width:1.8}.placement{fill:#dce9f8;fill-opacity:.78;stroke:#356ea5;stroke-width:3}.handle{fill:#fff;stroke:#356ea5;stroke-width:2}.t{font:18px sans-serif;fill:#262624}.small{font:15px sans-serif;fill:#4d4d49}.tiny{font:13px sans-serif;fill:#60605b}.head{font:bold 24px sans-serif;fill:#20201e}.section{font:bold 17px sans-serif;fill:#292927}.white{font:bold 16px sans-serif;fill:#fff}.annotation{font:italic 13px sans-serif;fill:#666}
  </style>
  <rect class="bg" width="1440" height="900"/>
  <rect class="panel" x="25" y="25" width="1390" height="850" rx="7"/>
  <text class="head" x="55" y="67">Signature Library</text>
  <text class="small" x="55" y="94">Presets › Board Approval › New Placement</text>
  <line class="rule" x1="25" y1="115" x2="1415" y2="115"/>

  <rect class="subtle" x="45" y="135" width="190" height="670" rx="5"/>
  <text class="section" x="65" y="172">Library</text>
  <rect class="selected" x="57" y="190" width="166" height="46" rx="4"/>
  <text class="t" x="75" y="219">Presets</text>
  <text class="t" x="75" y="274">Certificates</text>
  <text class="t" x="75" y="326">Appearances</text>
  <text class="t" x="75" y="378">Placements</text>

  <rect class="panel" x="255" y="135" width="260" height="670" rx="5"/>
  <text class="section" x="277" y="172">Signature Presets</text>
  <rect class="selected" x="275" y="198" width="220" height="78" rx="4"/>
  <text class="section" x="291" y="228">Board Approval</text>
  <text class="tiny" x="291" y="253">Editing new placement…</text>
  <text class="tiny" x="277" y="770">Parent preset draft is preserved</text>
  <text class="tiny" x="277" y="790">while this editor is active.</text>

  <rect class="panel" x="535" y="135" width="860" height="670" rx="5"/>
  <text class="section" x="560" y="171">New Placement</text>
  <text class="small" x="560" y="207">Name</text>
  <rect class="field" x="560" y="219" width="380" height="36" rx="3"/>
  <text class="small" x="576" y="243">Controlled Form • Approval box</text>

  <!-- Page preview -->
  <rect class="subtle" x="560" y="280" width="500" height="475" rx="5"/>
  <text class="tiny" x="580" y="306">CAPTURED FROM CURRENT PDF • document content not stored</text>
  <rect class="page" x="675" y="327" width="270" height="350" rx="2"/>
  <text class="tiny" x="785" y="351">Page 3</text>
  <line class="rule" x1="710" y1="382" x2="910" y2="382"/>
  <line class="rule" x1="710" y1="404" x2="890" y2="404"/>
  <line class="rule" x1="710" y1="426" x2="905" y2="426"/>
  <rect class="placement" x="790" y="585" width="130" height="58" rx="2"/>
  <text class="tiny" x="808" y="619">Signature area</text>
  <rect class="handle" x="784" y="579" width="12" height="12"/>
  <rect class="handle" x="914" y="579" width="12" height="12"/>
  <rect class="handle" x="784" y="637" width="12" height="12"/>
  <rect class="handle" x="914" y="637" width="12" height="12"/>
  <text class="annotation" x="650" y="716">Drag to move • resize with handles • Alt disables snapping</text>
  <text class="tiny" x="580" y="742">Guides snap only to page edges and centerlines.</text>

  <!-- Numeric controls -->
  <line class="rule" x1="1080" y1="198" x2="1080" y2="780"/>
  <text class="section" x="1105" y="225">Target page</text>
  <text class="small" x="1105" y="256">Page</text>
  <rect class="field" x="1204" y="236" width="150" height="34" rx="3"/>
  <text class="small" x="1220" y="258">3</text>
  <text class="tiny" x="1105" y="294">Source page: 612 × 792 pt</text>
  <text class="tiny" x="1105" y="315">Rotation: 0° • Portrait</text>

  <text class="section" x="1105" y="358">Position and size</text>
  <text class="small" x="1105" y="393">Left</text>
  <rect class="field" x="1204" y="372" width="150" height="34" rx="3"/>
  <text class="small" x="1220" y="394">360 pt</text>
  <text class="small" x="1105" y="439">Top</text>
  <rect class="field" x="1204" y="418" width="150" height="34" rx="3"/>
  <text class="small" x="1220" y="440">666 pt</text>
  <text class="small" x="1105" y="485">Width</text>
  <rect class="field" x="1204" y="464" width="150" height="34" rx="3"/>
  <text class="small" x="1220" y="486">180 pt</text>
  <text class="small" x="1105" y="531">Height</text>
  <rect class="field" x="1204" y="510" width="150" height="34" rx="3"/>
  <text class="small" x="1220" y="532">54 pt</text>
  <text class="tiny" x="1105" y="574">Measured from the visible page’s</text>
  <text class="tiny" x="1105" y="594">upper-left corner. 72 pt = 1 inch.</text>

  <rect class="subtle" x="1105" y="626" width="249" height="82" rx="4"/>
  <text class="small" x="1122" y="652">Placement is fully on page.</text>
  <text class="tiny" x="1122" y="677">Target geometry matches source.</text>
  <text class="tiny" x="1122" y="697">Exact rectangle will be reused.</text>

  <line class="rule" x1="25" y1="825" x2="1415" y2="825"/>
  <text class="tiny" x="55" y="855">Unsaved placement changes</text>
  <rect class="button" x="1160" y="838" width="100" height="34" rx="4"/>
  <text class="small" x="1187" y="861">Cancel</text>
  <rect class="primary" x="1272" y="838" width="112" height="34" rx="4"/>
  <text class="white" x="1307" y="861">Save</text>
</svg>
