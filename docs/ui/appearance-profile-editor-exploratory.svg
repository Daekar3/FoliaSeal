<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <title>FoliaSeal Appearance editor compact-selector wireframe</title>
  <desc>Signature Library Appearance editor with compact navigation, a wide scrollable form, a substantial sticky preview, and a stable footer.</desc>
  <style>
    .bg{fill:#f4f4f2}.panel{fill:#fff;stroke:#888781;stroke-width:2}.subtle{fill:#efefec;stroke:#aaa9a4;stroke-width:1.5}.button{fill:#f8f8f6;stroke:#777772;stroke-width:1.4}.primary{fill:#356ea5;stroke:#28557f;stroke-width:1.5}.field{fill:#fff;stroke:#8d8d88;stroke-width:1.3}.rule{stroke:#c1c1bc;stroke-width:1.3}.t{font:18px sans-serif;fill:#262624}.small{font:15px sans-serif;fill:#4d4d49}.tiny{font:13px sans-serif;fill:#60605b}.head{font:bold 24px sans-serif;fill:#20201e}.section{font:bold 17px sans-serif;fill:#292927}.white{font:bold 16px sans-serif;fill:#fff}.check{fill:#356ea5;stroke:#28557f;stroke-width:1}.radio{fill:#fff;stroke:#777;stroke-width:1.5}.dot{fill:#356ea5}
  </style>
  <rect class="bg" width="1440" height="900"/>
  <rect class="panel" x="25" y="25" width="1390" height="850" rx="7"/>
  <text class="head" x="55" y="68">Signature Library</text>
  <text class="small" x="55" y="94">Appearances › Formal Approval Block</text>
  <line class="rule" x1="25" y1="115" x2="1415" y2="115"/>

  <!-- Compact context header -->
  <text class="tiny" x="55" y="146">CATALOG</text>
  <rect class="field" x="55" y="155" width="190" height="40" rx="3"/>
  <text class="t" x="70" y="181">Appearances</text><text class="small" x="220" y="181">⌄</text>
  <text class="tiny" x="265" y="146">SAVED OBJECT</text>
  <rect class="field" x="265" y="155" width="430" height="40" rx="3"/>
  <text class="t" x="280" y="181">Formal Approval Block</text><text class="small" x="670" y="181">⌄</text>
  <text class="tiny" x="715" y="146">SORT</text>
  <rect class="field" x="715" y="155" width="160" height="40" rx="3"/>
  <text class="small" x="730" y="181">Name A–Z</text><text class="small" x="850" y="181">⌄</text>
  <rect class="button" x="895" y="155" width="92" height="40" rx="4"/><text class="small" x="922" y="181">New</text>
  <rect class="button" x="997" y="155" width="108" height="40" rx="4"/><text class="small" x="1018" y="181">Duplicate</text>
  <rect class="button" x="1115" y="155" width="88" height="40" rx="4"/><text class="small" x="1135" y="181">Rename</text>
  <rect class="button" x="1213" y="155" width="72" height="40" rx="4"/><text class="small" x="1237" y="181">Pin</text>
  <rect class="button" x="1295" y="155" width="90" height="40" rx="4"/><text class="small" x="1318" y="181">Delete</text>
  <line class="rule" x1="45" y1="215" x2="1395" y2="215"/>

  <!-- Full-width editor -->
  <rect class="panel" x="45" y="233" width="1350" height="572" rx="5"/>
  <text class="section" x="70" y="270">Formal Approval Block</text>
  <text class="small" x="70" y="306">Name</text>
  <rect class="field" x="70" y="318" width="610" height="38" rx="3"/>
  <text class="small" x="86" y="344">Formal Approval Block</text>

  <!-- Wide scrollable form -->
  <text class="section" x="70" y="395">Content</text>
  <rect class="check" x="70" y="411" width="18" height="18" rx="2"/><text class="white" x="73" y="426">✓</text>
  <text class="small" x="98" y="426">Show “Digitally signed by”</text>
  <rect class="check" x="70" y="447" width="18" height="18" rx="2"/><text class="white" x="73" y="462">✓</text><text class="small" x="98" y="462">Common name</text>
  <rect class="check" x="70" y="479" width="18" height="18" rx="2"/><text class="white" x="73" y="494">✓</text><text class="small" x="98" y="494">Signing time</text>
  <rect class="check" x="70" y="511" width="18" height="18" rx="2"/><text class="white" x="73" y="526">✓</text><text class="small" x="98" y="526">Title</text>
  <rect class="radio" x="320" y="447" width="18" height="18" rx="2"/><text class="small" x="348" y="462">Email</text>
  <rect class="radio" x="320" y="479" width="18" height="18" rx="2"/><text class="small" x="348" y="494">Organization</text>
  <rect class="radio" x="320" y="511" width="18" height="18" rx="2"/><text class="small" x="348" y="526">Reason</text>
  <rect class="button" x="500" y="447" width="105" height="32" rx="3"/><text class="small" x="518" y="469">Move up</text>
  <rect class="button" x="615" y="447" width="118" height="32" rx="3"/><text class="small" x="633" y="469">Move down</text>
  <rect class="check" x="500" y="493" width="18" height="18" rx="2"/><text class="white" x="503" y="508">✓</text><text class="small" x="528" y="508">Show field labels</text>

  <text class="section" x="70" y="574">Image</text>
  <rect class="field" x="70" y="588" width="430" height="38" rx="3"/><text class="small" x="86" y="613">signature.png</text>
  <rect class="button" x="512" y="588" width="105" height="38" rx="3"/><text class="small" x="534" y="613">Replace…</text>
  <rect class="button" x="627" y="588" width="106" height="38" rx="3"/><text class="small" x="653" y="613">Remove</text>
  <text class="tiny" x="70" y="654">Position</text>
  <circle class="radio" cx="88" cy="678" r="9"/><circle class="dot" cx="88" cy="678" r="5"/><text class="small" x="105" y="683">Left</text>
  <circle class="radio" cx="166" cy="678" r="9"/><text class="small" x="183" y="683">Right</text>
  <circle class="radio" cx="257" cy="678" r="9"/><text class="small" x="274" y="683">Above</text>
  <circle class="radio" cx="355" cy="678" r="9"/><text class="small" x="372" y="683">Below</text>
  <text class="tiny" x="500" y="654">Image prominence</text>
  <circle class="radio" cx="518" cy="678" r="9"/><text class="small" x="535" y="683">Supporting</text>
  <circle class="radio" cx="632" cy="678" r="9"/><circle class="dot" cx="632" cy="678" r="5"/><text class="small" x="649" y="683">Balanced</text>
  <rect class="subtle" x="70" y="718" width="663" height="42" rx="4"/><text class="section" x="88" y="744">Layout, typography, and style</text><text class="small" x="705" y="744">⌄</text>
  <text class="tiny" x="70" y="786">Form scrolls; header, preview, and footer remain stationary.</text>

  <!-- Sticky preview -->
  <line class="rule" x1="780" y1="290" x2="780" y2="780"/>
  <text class="section" x="810" y="322">Sample preview</text>
  <text class="tiny" x="810" y="346">Representative size • sample values • never saved</text>
  <rect x="810" y="370" width="540" height="300" fill="#d9d9d5" stroke="#999"/>
  <text class="tiny" x="827" y="394">Transparency checkerboard</text>
  <rect x="845" y="426" width="470" height="185" fill="#fff" fill-opacity="0.72" stroke="#222" stroke-width="1.5"/>
  <path d="M875 548 C930 460,980 580,1040 488 C1085 435,1125 570,1185 478" fill="none" stroke="#274b80" stroke-width="6"/>
  <text class="small" x="1195" y="474">Digitally signed by</text>
  <text class="small" x="1195" y="498">Morgan Ellery</text>
  <text class="tiny" x="1195" y="522">Title: Board Secretary</text>
  <text class="tiny" x="1195" y="545">2026-08-09 18:35 UTC</text>
  <text class="tiny" x="810" y="700">Text: stacked • Image: left, balanced • Font: Sans Serif 10 pt</text>
  <rect class="subtle" x="810" y="724" width="540" height="56" rx="4"/>
  <text class="small" x="828" y="749">Preview fits the representative placement.</text>
  <text class="tiny" x="828" y="769">On-document preview remains authoritative.</text>

  <!-- Stable transaction footer -->
  <line class="rule" x1="25" y1="825" x2="1415" y2="825"/>
  <text class="tiny" x="55" y="855">Unsaved appearance changes</text>
  <rect class="button" x="1160" y="838" width="100" height="34" rx="4"/><text class="small" x="1187" y="861">Cancel</text>
  <rect class="primary" x="1272" y="838" width="112" height="34" rx="4"/><text class="white" x="1307" y="861">Save</text>
</svg>
