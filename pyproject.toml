[project]
name = "pdf-signer"
version = "0.1.0"
description = "PDF signing desktop app foundations"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PDF Signer Team" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.0",
  "pytest>=8.2",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
